// ---------------- the hole (same as round 1: shaped like mtn-02, plus a pond and a rock outcrop) ----------------
const FAIR = [[0, -24, 12], [0, -120, 20], [3, -212, 24], [46, -252, 20], [80, -278, 15]];

  for (const b of BUNKERS) { if (ell(x, z, b) < 1) return 'sand'; if (ell(x, z, b, 0.7) < 1) return 'lip'; }

// clouds: big soft round puffs with flat bottoms
