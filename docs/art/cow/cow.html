<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cow Options</title>
<!-- Cow, artist mock-up (docs/art/cow/SPEC.md). Geometry: pieces.js (COWS), the fence from ../fence/pieces.js.
     Made from docs/art/bench/bench.html. Stand-alone; reads src/core and src/biomes only, never changes them.
     ?opts=A,B,C (&scale=1.5) → one row per look: close-up at the pasture fence beside a 1.8 m golfer | from the fairway
     ?opt=A&scales=1,1.5,2 → one row per size  ·  ?opt=A&poses=1 → standing / grazing / bob, the 3 patch layouts  — Agent: artist -->
<script type="importmap">{ "imports": { "three": "../../../vendor/three-0.187.0/three.module.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #grid { position: fixed; inset: 0; display: grid; pointer-events: none; }
  .cell { position: relative; border: 2px solid #fff; box-sizing: border-box; }
  .tag { position: absolute; top: 8px; left: 8px; right: 8px; background: rgba(255,255,255,.92); color: #1d3340; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; text-align: left; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .tag small { display: block; font-weight: 500; font-size: 10px; color: #4a5a64; }
  .row { position: absolute; bottom: 6px; left: 8px; color: #fff; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body.nolabel .tag { display: none; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { COWS, COW_KEYS, tris } from './pieces.js';
import { FENCES, layFence } from '../fence/pieces.js';
import { mixHex } from '../../../src/core/backdrop.js';
import { treeParts, gradientHex } from '../../../src/core/trees.js';
import meadow from '../../../src/biomes/meadow-day.js';
import alpine from '../../../src/biomes/alpine-day.js';
import island from '../../../src/biomes/island-day.js';
const SETS = { 'meadow-day': meadow, 'alpine-day': alpine, 'island-day': island };
const q = new URLSearchParams(location.search);
if (q.get('label') === '0') document.body.classList.add('nolabel');
let set, P;      // set per column below

const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = o => new THREE.MeshToonMaterial({ gradientMap: grad, ...o });

function geometryOf(parts, slots, at = { x: 0, z: 0, ry: 0 }) {
  const pos = [], col = [], idx = [], c = Math.cos(at.ry), s = Math.sin(at.ry);
  for (const p of parts) {
    const base = pos.length / 3, lo = P[slots[p.lo]], hi = P[slots[p.hi]];
    for (let i = 0; i < p.positions.length; i += 3) {
      const x = p.positions[i], y = p.positions[i + 1], z = p.positions[i + 2];
      pos.push(at.x + x * c + z * s, y, at.z - x * s + z * c);
      const cc = new THREE.Color(mixHex(lo, hi, p.w[i / 3])); col.push(cc.r, cc.g, cc.b);
    }
    for (const i of p.indices) idx.push(i + base);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); const n = g.toNonIndexed(); n.computeVertexNormals(); return n;
}
// the scene: a hole's edge (fairway, rough, the ground beyond OB), a few of the biome's scenery trees for scale
function world() {
  const scene = new THREE.Scene(); scene.fog = new THREE.Fog(P.fog, 120, 900);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(P.skyTop) }, hor: { value: new THREE.Color(P.skyHorizon) } },
    vertexShader: 'varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; varying vec3 vp; void main(){ float t = clamp(vp.y*1.9, 0.0, 1.0); gl_FragColor = vec4(mix(hor, top, pow(t, 0.62)), 1.0); }' }));
  scene.add(sky);
  scene.add(new THREE.HemisphereLight(P.ambient, P.shadow, 1.9)); const sun = new THREE.DirectionalLight(P.sun, 2.2); sun.position.set(-60, 80, 40); scene.add(sun);
  const flat = (w, d, c, x, z, y = 0) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), toon({ color: c })); m.position.set(x, y, z); scene.add(m); };
  flat(3000, 3000, P.deepRough, 0, 0); flat(70, 3000, P.rough, 0, 0, 0.005); flat(30, 3000, P.fringe, 0, 0, 0.01); flat(28, 3000, P.fairwayA, 0, 0, 0.015);
  for (let z = 30; z > -500; z -= 14) flat(28, 7, P.fairwayB, 0, z, 0.02);
  if (set === island) { flat(3000, 60, P.sand, 0, -260, 0.03); flat(3000, 2000, P.water, 0, -1290, 0.04); }
  // white OB stakes along x = 35
  for (let z = 40; z > -300; z -= 18) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.1), toon({ color: '#ffffff' })); st.position.set(35, 0.45, z); scene.add(st); }
  // scenery trees (the biome's first offTrees piece), drawn simply: trunk + canopy part
  const id = typeof set.offTrees[0] === 'string' ? set.offTrees[0] : set.offTrees[0].id, tp = treeParts(id);
  const treeMesh = (x, z, sc) => {
    for (const [part, lo, mid, top, R, H, y] of [[tp.trunk, P.trunk, P.trunk, P.trunk, 0.35, 4, 0], [tp.canopy, P.leafLow, id === 'palmTree' || id === 'spruceTree' ? P.leafAlt : id === 'pineTree' ? P.pine : P.leaf, P.leafTop, 3.2, 3.6, 4]]) {
      const g = new THREE.BufferGeometry(), col = [];
      for (const wv of part.w) { const c = new THREE.Color(gradientHex(lo, mid, top, wv)); col.push(c.r, c.g, c.b); }
      g.setAttribute('position', new THREE.Float32BufferAttribute(part.positions.map((v, i) => (i % 3 === 0 ? v * R : i % 3 === 1 ? v * H + y : v * R) * sc), 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(part.indices); g.computeVertexNormals();
      const m = new THREE.Mesh(g, toon({ vertexColors: true, side: THREE.DoubleSide })); m.position.set(x, 0, z); scene.add(m);
    }
  };
  for (const [x, z, s] of [[66, -84, 1.1], [34 + 40, -50, 0.95], [44, -110, 1.2], [80, -100, 1.0], [-50, -60, 1.1], [-46, -120, 1.0], [58, -30, 0.9]]) treeMesh(x, z, s);
  return scene;
}



set = meadow; P = { ...COW_KEYS, ...meadow.palette };
const golferAt = (scene, x, z, ry = 0) => { const m = toon({ color: '#2a4a7a' }), skin = toon({ color: '#f0c8a0' });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.2, 1.5, 8), m); body.position.set(x, 0.75, z);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), skin); head.position.set(x, 1.65, z); scene.add(body, head); };
const mesh = (parts, slots, at) => new THREE.Mesh(geometryOf(parts, slots, at), toon({ vertexColors: true, flatShading: true, side: THREE.DoubleSide }));
const cow = (scene, look, sc, at, opt) => scene.add(mesh(look.build(opt).map(p => ({ ...p, positions: p.positions.map(v => v * sc) })), look.slots, at));
// a pasture beyond the OB stakes (x = 35): a rail fence at 1.5× from 38 to 82 m, a herd of 4 inside
const FENCE = [[38, 12], [38, -62], [84, -62], [84, 12], [38, 12]];
const HERD = [{ x: 47, z: -8, ry: -2.2, pose: 'stand', pattern: 0 }, { x: 55, z: -20, ry: -1.1, pose: 'graze', pattern: 1 },
  { x: 49, z: -34, ry: -0.6, pose: 'graze', pattern: 2 }, { x: 63, z: -12, ry: 2.6, pose: 'stand', pattern: 1 }];
function pasture(look, sc) {
  const scene = world();
  const f = FENCES.A; scene.add(mesh(layFence(f, FENCE, () => 0, 1.5).parts, { ...f.slots }, { x: 0, z: 0, ry: 0 }));
  for (const h of HERD) cow(scene, look, sc, { x: h.x, z: h.z, ry: h.ry }, h);
  golferAt(scene, 35.6, -14);
  return scene;
}
// close-up: one standing and one grazing cow at the given size, the golfer a step away for scale
function closeUp(look, sc) {
  const scene = world();
  cow(scene, look, sc, { x: 0, z: 0, ry: 1.2 }, { pose: 'stand', pattern: 0 });
  cow(scene, look, sc, { x: 2.6 * sc, z: -2.4 * sc, ry: 0.4 }, { pose: 'graze', pattern: 1 });
  golferAt(scene, -1.3 * sc - 0.5, -0.6 * sc);
  return scene;
}
const FAR = [[18, 2.6, -12], [55, 0.6, -19]];
const panels = [];
let NC = 2;
const rowsOf = () => {
  if (q.get('scales')) return q.get('scales').split(',').map(s => [q.get('opt') || 'A', Number(s)]);
  return (q.get('opts') || 'A,B,C').split(',').map(o => [o, Number(q.get('scale') || 1.5)]);
};
if (q.get('poses')) {
  const look = COWS[q.get('opt') || 'A'];
  for (const [opt, label] of [[{ pose: 'stand', pattern: 0 }, 'standing · patches 1'], [{ pose: 'graze', pattern: 1 }, 'grazing · patches 2'],
    [{ pose: 'stand', pattern: 2, bob: 0.35 }, 'head-bob, low · patches 3'], [{ pose: 'graze', pattern: 0, bob: -0.3, swish: 0.5 }, 'grazing, head up + tail swish']]) {
    const scene = world(); cow(scene, look, 1, { x: 0, z: 0, ry: 1.2 }, opt); golferAt(scene, -1.7, -1.4);
    panels.push({ scene, view: 'close', cam: [[2.9, 1.7, 5.0], [0.45, 0.75, 0]], tag: `${look.name.split(' · ')[0]} · ${label}<small>${tris(look.build(opt))} triangles</small>`, row: '1× beside a 1.8 m golfer' });
  }
} else for (const [opt, sc] of rowsOf()) {
  const look = COWS[opt], views = q.get('far') === '0' ? ['close'] : q.get('far') === 'only' ? ['far'] : ['close', 'far'];
  if (views.length === 1 || q.get('cols') === '1') NC = 1;
  for (const view of views) {
    panels.push({ scene: view === 'close' ? closeUp(look, sc) : pasture(look, sc), view, cam: view === 'close' ? (q.get('cols') === '1' ? [[2.3 * sc + 1, 1.0 * sc + 0.6, 4.8 * sc + 1.4], [0.6 * sc, 0.7 * sc, -1.0 * sc]] : NC === 1 ? [[1.5 * sc + 0.8, 0.85 * sc + 0.5, 3.0 * sc + 1.0], [0.75 * sc, 0.8 * sc, -1.0 * sc]] : [[2.6 * sc + 1.6, 1.3 * sc + 0.7, 4.6 * sc + 2.2], [0.2, 0.75 * sc, -0.6 * sc]]) : FAR,
      tag: (view === 'close' || NC === 1) ? `${q.get('scales') ? look.name.split(' · ')[0] + ' at ' + sc + '×' : look.name + ' at ' + sc + '×'}<small>${q.get('scales') ? (look.size.split(', ')[1]) + ' at 1× · ' : look.sub + ' · '}${tris(look.build())} triangles</small>` : '',
      row: view === 'close' ? 'close-up, 1.8 m golfer' : 'a herd of 4 in its pasture, seen from the rough (~35 m)' });
  }
}
const nc = NC, nr = Math.ceil(panels.length / nc), grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${nc}, 1fr)`; grid.style.gridTemplateRows = `repeat(${nr}, 1fr)`;
for (const p of panels) { const d = document.createElement('div'); d.className = 'cell'; d.innerHTML = (p.tag ? `<div class="tag">${p.tag}</div>` : '') + `<div class="row">${p.row}</div>`; grid.appendChild(d); }
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.setScissorTest(true); document.body.prepend(renderer.domElement);
const W = innerWidth / nc, H = innerHeight / nr;
panels.forEach((p, i) => {
  const c = i % nc, r = Math.floor(i / nc), cam = new THREE.PerspectiveCamera(p.view === 'close' ? 50 : 55, W / H, 0.1, 3000);
  cam.position.set(...p.cam[0]); cam.lookAt(...p.cam[1]);
  renderer.setViewport(c * W, (nr - 1 - r) * H, W, H); renderer.setScissor(c * W, (nr - 1 - r) * H, W, H); renderer.render(p.scene, cam);
});
document.title = 'ready';
</script>
</body>
</html>
