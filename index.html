<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pocket Links</title>
<style>
  :root {
    --panel: rgba(12, 28, 20, 0.72);
    --text: #f4f7ef;
    --muted: #b9cbb4;
    --accent: #ffd447;
    --good: #57e07a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .panel { background: var(--panel); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(4px); }

  /* Top-left scorecard */
  #info { position: fixed; top: 12px; left: 12px; min-width: 170px; font-size: 14px; line-height: 1.5; }
  #info .title { font-weight: 800; font-size: 16px; letter-spacing: .5px; color: var(--accent); }
  #info b { color: #fff; }

  /* Top-right: wind + minimap */
  #side { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #windBox { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  #windArrow { width: 34px; height: 34px; transition: transform .2s; }
  #minimap { display: block; border-radius: 8px; border: 2px solid rgba(255,255,255,.5); }

  /* Center message */
  /* H1: the text wraps (hud.js keeps it clear of the minimap and the scorecard with max-width) */
  #msg { position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; line-height: 1.1;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.35); opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center;
    width: max-content; max-width: calc(100vw - 24px); text-wrap: balance; overflow-wrap: break-word; }
  #msg.show { opacity: 1; }
  #msg small { display: block; font-size: 16px; font-weight: 600; }

  /* Bottom: meter + controls */
  #bottom { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(640px, calc(100% - 24px));
    display: flex; flex-direction: column; gap: 8px; }
  #hint { text-align: center; font-size: 14px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); min-height: 18px; }
  #meterBar { position: relative; height: 30px; border-radius: 15px; overflow: hidden;
    background: linear-gradient(90deg, #2a3b55 0%, #2a3b55 16.67%, #1d2a1f 16.67%); border: 2px solid rgba(255,255,255,.75); }
  #meterFill { position: absolute; top: 0; bottom: 0; left: 16.67%; width: 0; background: linear-gradient(90deg, #ffb13b, #ff5a36); }
  #sweet { position: absolute; top: 0; bottom: 0; left: calc(16.67% - 4.17%); width: 8.33%; background: rgba(87,224,122,.55); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  /* S11: above the lie's power cap the meter is out of reach */
  #capShade { position: absolute; top: 0; bottom: 0; right: 0; display: none;
    background: repeating-linear-gradient(135deg, rgba(150,150,150,.75) 0 6px, rgba(110,110,110,.75) 6px 12px); }
  #pinTick { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #fff; box-shadow: 0 0 4px #000; }
  #pinTick::after { content: "⚑"; position: absolute; top: 3px; left: 5px; font-size: 13px; color: #fff; text-shadow: 0 0 3px #000; }
  /* H1: near the right end the flag goes on the left of its line, so the rounded end doesn't cut it off */
  #pinTick.flip::after { left: auto; right: 5px; }
  #powerMark { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; display: none; }
  #marker { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 6px #000; }
  /* S8: the power click was missed, so the next click is a mini shot */
  #meterBar.nopower { background: #7a1d1d; border-color: #ff6b6b; }
  #meterBar.nopower::after { content: "NO POWER"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 900; letter-spacing: 1px; color: #ffd6d6; pointer-events: none; }
  /* X8: a ?tune= link is active, so this isn't the real game feel */
  #tuned { align-self: center; max-width: 100%; background: #d6336c; color: #fff; font: 700 11px/1.3 system-ui, sans-serif;
    padding: 3px 8px; border-radius: 6px; text-align: center; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #tuned[hidden] { display: none; }
  /* H1: a shadow like the hint line, so the labels stay readable over sand and bright grass */
  #meterLabels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #eef5ea; padding: 2px 4px 0;
    text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.8); }
  #controls { display: flex; gap: 8px; align-items: stretch; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid rgba(255,255,255,.35); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:active { background: rgba(255,255,255,.25); }
  .aimBtn { flex: 0 0 auto; font-weight: 700; }
  #club { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px 6px; }
  #club button { padding: 6px 12px; font-size: 18px; line-height: 1; }
  #club .name { text-align: center; }
  #club .name b { display: block; font-size: 17px; }
  #club .name small { color: var(--muted); }
  /* X9: ⏩ Skip, above the meter on the right while the ball flies or rolls (doesn't move the layout) */
  #skipBtn { position: absolute; right: 0; bottom: calc(100% + 8px); font-weight: 800; padding: 8px 16px; background: rgba(12, 28, 20, .85); border-color: var(--accent); color: var(--accent); }
  #skipBtn[hidden] { display: none; }
  #swingBtn { flex: 0 0 auto; font-weight: 900; background: #2f8f46; border-color: #8ef0a5; padding: 8px 18px; }

  /* Overlays */
  /* H1: a card taller than the screen scrolls (margin: auto centres it only while it fits, so its
     title is never pushed above the screen), and its main button sticks to the bottom edge */
  .overlay { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: rgba(5, 20, 12, .55); padding: 16px;
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .overlay.hidden { display: none; }
  .card { background: #13291d; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 22px 26px; max-width: 460px; width: 100%; margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .card .big { position: sticky; bottom: 0; box-shadow: 0 -6px 14px #13291d; }
  .card h1 { margin: 0 0 4px; color: var(--accent); font-size: 28px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 500; }
  .card ol { padding-left: 20px; margin: 0 0 12px; line-height: 1.55; font-size: 15px; }
  .card p { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .card .big { display: block; width: 100%; margin-top: 10px; padding: 12px; font-size: 18px; font-weight: 800; background: #2f8f46; border-color: #8ef0a5; }
  #resultTitle { font-size: 40px; text-align: center; margin: 0; color: var(--accent); }
  #resultText { text-align: center; font-size: 16px; color: var(--text); }
  .card a { color: var(--accent); }
  .card .notice { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: rgba(255,212,71,.15); color: var(--accent); font-size: 14px; }
  .card .notice.error { background: rgba(255,90,90,.18); color: #ffd6d6; border: 1px solid #ff6b6b; }
  .card .big:disabled { background: #444; border-color: #777; cursor: default; }
  kbd { background: #2c4a37; border-radius: 4px; padding: 1px 6px; font-size: 13px; }

  /* Debug overlay (backtick key) */
  #debug { position: fixed; left: 12px; bottom: 150px; margin: 0; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    color: #e9ffe9; background: rgba(0,0,0,.66); border-radius: 8px; padding: 8px 10px; pointer-events: none; white-space: pre; z-index: 5; }
  #debug.hidden { display: none; }

  /* H1: short screens (phone landscape): a compact card, and the debug overlay moves up between the
     scorecard and the minimap in a smaller font so it never covers them or the controls */
  @media (max-height: 500px) {
    .overlay { padding: 10px; }
    .card { padding: 14px 18px; max-width: 600px; }
    .card h1 { font-size: 22px; }
    .card h2 { margin-bottom: 8px; font-size: 14px; }
    .card ol { font-size: 13px; line-height: 1.4; margin-bottom: 6px; }
    .card p { font-size: 13px; margin: 6px 0; }
    .card .big { margin-top: 6px; padding: 9px; font-size: 16px; }
    #resultTitle { font-size: 30px; }
    #debug { top: 12px; bottom: auto; font-size: 10px; line-height: 1.3; padding: 6px 8px; white-space: pre-wrap; } /* debug.js fits it between the panels */
  }

  @media (max-width: 560px) {
    #info { font-size: 12px; min-width: 0; padding: 8px 10px; }
    #info .title { font-size: 14px; }
    #minimap { width: var(--mm-mobile-w); height: var(--mm-mobile-h); }
    #windBox { font-size: 12px; padding: 6px 8px; }
    #msg { font-size: 26px; }
    .aimBtn { padding: 8px 14px; }
    .aimBtn span { display: none; }
    #club .name b, #club .name small { white-space: nowrap; }
    #club button { padding: 6px 8px; }
    #swingBtn { padding: 8px 10px; }
    #club .name b { font-size: 14px; }
  }
  /* Short screens (phone landscape): the minimap shrinks, keeping its shape, so it ends above the
     meter and controls (H1, PR #15). After the narrow-screen rules so it wins on small phones too. */
  @media (max-height: 500px) {
    #minimap { width: auto; height: min(var(--mm-h, 220px), calc(100vh - 240px)); }
    /* Gate A C6: iOS Safari's 100vh ignores the browser bars; dvh is the visible height (16.4+ has it) */
    #minimap { height: min(var(--mm-h, 220px), calc(100dvh - 240px)); }
  }
</style>
<!-- Gate A C2: if the game can't start, say why in plain words on the intro card instead of leaving a
     dead Tee off button. Classic script (not a module) so it also runs in browsers too old for the game. -->
<script>
(function () {
  var failed = false;
  function show(msg) {
    var n = document.getElementById('notice'), b = document.getElementById('startBtn');
    if (!n) return document.addEventListener('DOMContentLoaded', function () { show(msg); });
    n.textContent = msg; n.hidden = false; n.className = 'notice error';
    if (b) { b.disabled = true; b.textContent = "Can't start"; }
  }
  // Once the game has started (main.js sets __golfStarted), later errors are not start-up problems
  function fail(msg, err) {
    if (failed || window.__golfStarted) return;
    failed = true;
    if (err) console.error('Pocket Links could not start:', err);
    show(msg);
  }
  window.__golfFail = fail;
  if (location.protocol === 'file:') {
    fail('The game has to be opened from a web server, not straight from the folder. Run "python3 -m http.server 8000" in the game folder and open http://localhost:8000');
  } else if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    fail('This browser is too old for the game. It needs Safari or iOS 16.4+, Chrome or Edge 89+, or Firefox 108+.');
  } else if (!window.WebGLRenderingContext) {
    fail("Your browser can't show 3D graphics (WebGL), so the game can't start. Try another browser.");
  }
  // A game file that didn't load (no connection, blocked) fires on its <script>; a bug fires on window
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window) {
      if (t.tagName === 'SCRIPT') fail('Part of the game did not load (' + (t.getAttribute('src') || 'a script') + '). Check your connection and reload the page.');
      return;
    }
    fail('The game hit an error while starting: ' + (e.message || 'unknown error') + '. Reloading may help; if not, please report it.', e.error);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    fail('The game hit an error while starting: ' + ((r && r.message) || r) + '. Reloading may help; if not, please report it.', r);
  });
})();
</script>
<!-- Three.js is committed in the repo (Gate A C1): no CDN needed, works offline. Upgrade = swap this one folder. -->
<script type="importmap">
  { "imports": { "three": "./vendor/three-0.160.0/three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="info" class="panel">
  <div class="title" id="holeTitle">HOLE</div>
  <div>Stroke: <b id="strokeTxt">1</b></div>
  <div>To pin: <b id="distTxt">-</b></div>
  <div>Lie: <b id="lieTxt">Tee box</b></div>
  <div id="slopeRow">Slope: <b id="slopeTxt">Flat</b></div>
</div>

<div id="side">
  <div id="windBox" class="panel">
    <svg id="windArrow" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.5)"/><path d="M20 5 L29 20 L23 20 L23 34 L17 34 L17 20 L11 20 Z" fill="#7fd0ff"/></svg>
    <div><div style="color:var(--muted);font-size:11px">WIND</div><b id="windTxt">0 mph</b></div>
  </div>
  <canvas id="minimap" width="60" height="220"></canvas>
</div>

<div id="msg"></div>

<div id="bottom">
  <button id="skipBtn" hidden title="Skip to where the ball stops (Space or Enter)">⏩ Skip</button>
  <div id="tuned" hidden></div>
  <div id="hint">Click or press Space to start your swing</div>
  <div>
    <div id="meterBar">
      <div id="meterFill"></div>
      <div id="sweet"></div>
      <div id="capShade"></div>
      <div id="pinTick"></div>
      <div id="powerMark"></div>
      <div id="marker"></div>
    </div>
    <div id="meterLabels"><span>◀ accuracy</span><span>power ▶</span></div>
  </div>
  <div id="controls">
    <button class="aimBtn" id="aimL">◀<span> Aim</span></button>
    <div id="club" class="panel">
      <button id="clubPrev" title="Longer club">‹</button>
      <div class="name"><b id="clubName">-</b><small id="clubDist">-</small></div>
      <button id="clubNext" title="Shorter club">›</button>
    </div>
    <button class="aimBtn" id="aimR"><span>Aim </span>▶</button>
    <button id="swingBtn">SWING</button>
  </div>
</div>

<div id="intro" class="overlay">
  <div class="card">
    <h1>Pocket Links</h1>
    <p id="notice" class="notice" hidden></p>
    <h2 id="introSub"></h2>
    <ol id="introSteps"></ol>
    <p id="introBlurb"></p>
    <button class="big" id="startBtn">Tee off</button>
    <p style="text-align:center;margin-bottom:0"><a id="introLink" href="#"></a></p>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card">
    <h1 id="resultTitle">Par</h1>
    <p id="resultText"></p>
    <button class="big" id="againBtn">Play again</button>
    <p style="text-align:center;margin-bottom:0"><a id="resultLink" href="#"></a></p>
  </div>
</div>

<pre id="debug" class="hidden"></pre>

<!-- The game: src/game/main.js picks the hole from ?hole=pl-01 / ?hole=pl-02 (default pl-01) -->
<script type="module" src="src/game/main.js"></script>
</body>
</html>
